<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人中心</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; margin: 0; background: #f7f8fa; }
    .container { max-width: 960px; margin: 40px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,0.06); border-radius: 14px; overflow: hidden; }
    .header { padding: 20px 24px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 20px; margin: 0; }
    .token { display:flex; gap:8px; align-items:center; }
    .token input { width: 380px; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; }
    .token button { padding: 8px 12px; border: none; background: #1677ff; color: #fff; border-radius: 8px; cursor: pointer; }
    .content { padding: 20px 24px; }
    .form { display: grid; grid-template-columns: 1fr 160px 120px 120px; gap: 12px; margin-bottom: 16px; }
    .form input, .form select { padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; }
    .form button { background: #52c41a; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
    th { color: #555; font-weight: 600; }
    .empty { padding: 24px; color: #888; text-align: center; }
    .delete { color: #ff4d4f; cursor: pointer; }
    .message { margin-top: 10px; color: #555; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>
<body>
  <div id="app" class="container">
    <div class="header">
      <h1>个人中心 - 持有/关注股票</h1>
      <div class="token">
        <input v-model="token" type="text" placeholder="粘贴登录后获取的token" />
        <button @click="saveToken">保存令牌</button>
      </div>
    </div>
    <div class="content">
      <!--
      组件：HoldingsTable
      功能：展示并管理用户的持有/关注股票列表；提供新增与删除操作。
      参数：
        - 无（内部从本地存储或输入框获取令牌）
      返回值：
        - 无（渲染表格并通过消息提示操作结果）
      事件：
        - add: 点击“新增”按钮触发新增请求
        - delete: 点击“删除”按钮触发删除请求
      -->
      <div class="form">
        <input v-model="newStockCode" placeholder="股票代码，如：600000" />
        <select v-model="relationType">
          <option value="WATCHED">关注</option>
          <option value="HELD">持有</option>
        </select>
        <button @click="addHolding">新增</button>
        <button @click="fetchHoldings">刷新</button>
      </div>

      <table v-if="holdings.length">
        <thead>
          <tr>
            <th>股票代码</th>
            <th>股票名称</th>
            <th>行业</th>
            <th>类型</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="h in holdings" :key="h.id">
            <td>{{ h.stock_code }}</td>
            <td>{{ h.stock_name }}</td>
            <td>{{ h.industry || '-' }}</td>
            <td>{{ h.relation_type === 'HELD' ? '持有' : '关注' }}</td>
            <td><span class="delete" @click="deleteHolding(h.id)">删除</span></td>
          </tr>
        </tbody>
      </table>
      <div class="empty" v-else>暂无数据，添加后显示。</div>
      <div class="message">{{ message }}</div>
    </div>
  </div>

  <script>
    /*
    根实例：PersonalCenterApp
    功能：管理令牌状态、与后端API交互并维护持有/关注列表的UI状态
    数据：
      - token(String): 认证令牌，用于请求头 Authorization: Bearer {token}
      - holdings(Array): 当前用户持有/关注记录列表
      - newStockCode(String): 新增时输入的股票代码
      - relationType(String): 新增记录的关系类型（WATCHED/HELD）
      - message(String): 操作提示消息
    方法：
      - saveToken(): 将令牌保存至localStorage
      - fetchHoldings(): 拉取列表 GET /django/api/personal/holdings/
      - addHolding(): 新增记录 POST /django/api/personal/holdings/
      - deleteHolding(id): 删除记录 DELETE /django/api/personal/holdings/{id}/
    事件：
      - 用户点击新增/删除按钮触发对应方法
    */
    new Vue({
      el: '#app',
      data: {
        token: localStorage.getItem('token') || '',
        holdings: [],
        newStockCode: '',
        relationType: 'WATCHED',
        message: ''
      },
      mounted() {
        this.fetchHoldings();
      },
      methods: {
        saveToken() {
          localStorage.setItem('token', this.token);
          this.message = '令牌已保存';
        },
        async fetchHoldings() {
          try {
            const res = await fetch('/django/api/personal/holdings/', {
              headers: { 'Authorization': 'Bearer ' + (this.token || localStorage.getItem('token') || '') }
            });
            const json = await res.json();
            if (json.code === 200) {
              this.holdings = (json.data && json.data.list) || [];
              this.message = '列表已更新';
            } else {
              this.message = json.message || '加载失败';
            }
          } catch (e) {
            this.message = '请求失败：' + e.message;
          }
        },
        async addHolding() {
          if (!this.newStockCode) { this.message = '请输入股票代码'; return; }
          try {
            const res = await fetch('/django/api/personal/holdings/', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + (this.token || localStorage.getItem('token') || '')
              },
              body: JSON.stringify({ stock_code: this.newStockCode, relation_type: this.relationType })
            });
            const json = await res.json();
            if (json.code === 200) {
              this.message = '新增成功';
              this.newStockCode = '';
              this.fetchHoldings();
            } else {
              this.message = json.message || '新增失败';
            }
          } catch (e) {
            this.message = '请求失败：' + e.message;
          }
        },
        async deleteHolding(id) {
          if (!id) return;
          try {
            const res = await fetch('/django/api/personal/holdings/' + id + '/', {
              method: 'DELETE',
              headers: { 'Authorization': 'Bearer ' + (this.token || localStorage.getItem('token') || '') }
            });
            const json = await res.json();
            if (json.code === 200) {
              this.message = '删除成功';
              this.fetchHoldings();
            } else {
              this.message = json.message || '删除失败';
            }
          } catch (e) {
            this.message = '请求失败：' + e.message;
          }
        }
      }
    });
  </script>
</body>
</html>
