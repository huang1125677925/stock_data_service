{% extends 'forum/base.html' %}

{% block title %}发布新帖子 - 论坛{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="card-title mb-0">发布新帖子</h4>
            </div>
            <div class="card-body">
                <form action="{% url 'forum:post_create' %}" method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="title" class="form-label">标题</label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>
                    <div class="mb-3">
                        <label for="content" class="form-label">内容</label>
                        <textarea class="form-control" id="content" name="content" rows="10" required></textarea>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'forum:post_list' %}" class="btn btn-outline-secondary">取消</a>
                        <button type="submit" class="btn btn-primary">发布帖子</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // 简单的表单验证
    document.querySelector('form').addEventListener('submit', function(e) {
        const title = document.getElementById('title').value.trim();
        const content = document.getElementById('content').value.trim();
        
        if (!title || !content) {
            e.preventDefault();
            alert('标题和内容不能为空！');
        }
    });
</script>
{% endblock %}
